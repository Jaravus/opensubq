[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensubq"
version = "0.1.0"
description = "Theoretical reconstruction of the SubQ sub-quadratic attention architecture."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
train = [
    "tiktoken>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["opensubq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
